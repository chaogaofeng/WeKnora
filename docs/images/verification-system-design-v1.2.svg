<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1630" viewBox="0 0 1920 1630" role="img" aria-labelledby="title desc"><title id="title">一期观测诊断与分流流程 v1.2</title><desc id="desc">仅采集启用后的新问答，先验证回答再做分层诊断，依据风险分流；补查有限、版本可追溯，高风险与未知不自动通过。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7790B0" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1920" height="1630" rx="0" fill="#F3F6FB"/><rect x="64" y="38" width="280" height="34" rx="8" fill="#EAF0FF"/><text x="204.0" y="62" font-size="17" font-weight="500" fill="#245BDB" text-anchor="middle">WEKNORA  /  DESIGN 02</text><text x="64" y="123" font-size="46" font-weight="650" fill="#172B46" text-anchor="start">一期闭环：机器先排查，人工做裁决</text><text x="66" y="167" font-size="22" font-weight="400" fill="#576A82" text-anchor="start">全量检查基础事实，异常、高风险与抽检案例按需深查；证据不足时保留未知。</text><rect x="1632" y="47" width="224" height="34" rx="8" fill="#EAF0FF"/><text x="1744.0" y="71" font-size="18" font-weight="500" fill="#245BDB" text-anchor="middle">v1.2 · 2026.09.28</text><rect x="64" y="210" width="565" height="149" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><rect x="84" y="234" width="5" height="25" rx="2" fill="#245BDB"/><text x="103" y="255" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">新运行身份与范围</text><text x="89" y="298" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">渠道 / 模式 / 配置快照 / 启用状态</text><text x="89" y="332" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">只纳入启用后新发起的问答</text><rect x="678" y="210" width="565" height="149" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><rect x="698" y="234" width="5" height="25" rx="2" fill="#245BDB"/><text x="717" y="255" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">新增问答采集</text><text x="703" y="298" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">实际进入模型的证据与来源元数据</text><text x="703" y="332" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">记录完成、取消、缺失和截断</text><rect x="1292" y="210" width="564" height="149" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><rect x="1312" y="234" width="5" height="25" rx="2" fill="#137D6D"/><text x="1331" y="255" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">事后只读补查</text><text x="1317" y="298" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">原文 / Wiki / 修订 / 可选日志</text><text x="1317" y="332" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">独立时间与版本，不冒充当时证据</text><path d="M346,359 L346,389 L656,389 L656,412" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><path d="M961,359 L961,412" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="426" width="1179" height="131" rx="16" fill="#EAF0FF" stroke="#B9CCF3" stroke-width="1.5"/><text x="90" y="468" font-size="27" font-weight="600" fill="#245BDB" text-anchor="start">01  统一档案与证据覆盖</text><text x="90" y="510" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">完整 / 部分 / 缺失或未知 → 明确可验证范围</text><text x="90" y="541" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">渠道 · 配置模式 · 实际执行与来源 · 正文快照 · 版本 · 使用位置</text><path d="M654,557 L654,589" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="603" width="1179" height="127" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><rect x="84" y="627" width="5" height="25" rx="2" fill="#245BDB"/><text x="103" y="648" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">02  异步回答验证</text><text x="89" y="691" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">逐论断 / JSON 字段：支持、部分支持、矛盾、未找到支持、无法验证</text><path d="M654,730 L654,762" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="776" width="1179" height="169" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="90" y="817" font-size="27" font-weight="600" fill="#137D6D" text-anchor="start">03  根因诊断</text><text x="90" y="857" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">基础排查：采集 / 权限 / 工具 / 上下文 / 生成；按需比较 Wiki 与原文</text><text x="90" y="890" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">输出：观察事实 → 根因候选 → 支持与反对证据 → 未知项 → 待裁决点</text><text x="90" y="923" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">同一来源版本与适用条件的问题可归组，每条回答仍保留自身判定</text><path d="M1574,359 L1574,398 L1882,398 L1882,753 L1270,753 L1270,839 L1254,839" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><text x="1410" y="417" font-size="19" font-weight="400" fill="#137D6D" text-anchor="start">仅用于事后核验</text><rect x="1292" y="460" width="564" height="270" rx="16" fill="#FFFAEF" stroke="#DCE4EF" stroke-width="1.5"/><rect x="1312" y="484" width="5" height="25" rx="2" fill="#946000"/><text x="1331" y="505" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">诊断执行边界</text><text x="1317" y="548" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">只读工具允许清单，继承来源权限</text><text x="1317" y="582" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">补查次数 / 时限 / 模型费用有预算</text><text x="1317" y="616" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">版本缺失、失败、预算耗尽均保留未知</text><text x="1317" y="650" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">模型自报置信度不单独决定免人工</text><rect x="1292" y="776" width="564" height="169" rx="16" fill="#EAF6F2" stroke="#DCE4EF" stroke-width="1.5"/><text x="1318" y="817" font-size="26" font-weight="600" fill="#137D6D" text-anchor="start">较完整 ≠ 强行给定论</text><text x="1318" y="859" font-size="21" font-weight="400" fill="#137D6D" text-anchor="start">异常、高风险与抽检案例按需深查</text><text x="1318" y="891" font-size="21" font-weight="400" fill="#137D6D" text-anchor="start">未做来源核验时，明确显示未核验</text><text x="1318" y="923" font-size="21" font-weight="400" fill="#137D6D" text-anchor="start">疑似根因与已确认事实分开</text><path d="M960,945 L960,973" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="988" width="1792" height="75" rx="16" fill="#172B46"/><text x="960" y="1034" font-size="27" font-weight="600" fill="#FFFFFF" text-anchor="middle">04  风险分流  ·  综合业务风险、证据完整性、可检查结果与校准规则</text><path d="M276,1063 L276,1093" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="1107" width="424" height="166" rx="16" fill="#EFF9F5" stroke="#DCE4EF" stroke-width="1.5"/><rect x="84" y="1131" width="5" height="25" rx="2" fill="#137D6D"/><text x="103" y="1152" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">低风险且符合通过规则</text><text x="89" y="1195" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">自动记录机器结论</text><text x="89" y="1229" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">按模式 / 渠道 / 来源分层抽检</text><path d="M732,1063 L732,1093" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="1107" width="424" height="166" rx="16" fill="#FFF2F3" stroke="#DCE4EF" stroke-width="1.5"/><rect x="540" y="1131" width="5" height="25" rx="2" fill="#B93848"/><text x="559" y="1152" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">高风险 / 冲突 / 关键不确定</text><text x="545" y="1195" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">诊断包 → 重点人工复核</text><text x="545" y="1229" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">AI 判为支持也不能跳过</text><path d="M1188,1063 L1188,1093" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="976" y="1107" width="424" height="166" rx="16" fill="#FFFAEF" stroke="#DCE4EF" stroke-width="1.5"/><rect x="996" y="1131" width="5" height="25" rx="2" fill="#946000"/><text x="1015" y="1152" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">证据不足 / 根因难区分</text><text x="1001" y="1195" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">有界补查 → 再诊断与分流</text><text x="1001" y="1229" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">仍不足：待补证 / 保留未知</text><path d="M1644,1063 L1644,1093" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="1432" y="1107" width="424" height="166" rx="16" fill="#F8FAFD" stroke="#DCE4EF" stroke-width="1.5"/><rect x="1452" y="1131" width="5" height="25" rx="2" fill="#576A82"/><text x="1471" y="1152" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">采集 / 工具 / 任务故障</text><text x="1457" y="1195" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">技术排查 → 按版本重试</text><text x="1457" y="1229" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">高风险业务同时保留复核</text><rect x="64" y="1310" width="1792" height="111" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="90" y="1351" font-size="27" font-weight="600" fill="#172B46" text-anchor="start">05  结论留存与校准反馈</text><text x="90" y="1391" font-size="23" font-weight="400" fill="#576A82" text-anchor="start">回答判定与根因分别复核 · 自动记录与人工确认分开 · 新证据触发新版本 · 只保存运营记录</text><path d="M276,1273 L276,1300" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><path d="M732,1273 L732,1300" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1188,1273 L1188,1300" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1644,1273 L1644,1300" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="1455" width="1792" height="105" rx="16" fill="#EAF0FF"/><text x="90" y="1494" font-size="24" font-weight="600" fill="#245BDB" text-anchor="start">采集从启用时开始，后台任务可恢复</text><text x="90" y="1534" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">不适配或回填旧问答；仅恢复已采集运行的任务。新问答实际使用的会话上下文与知识修订仍可核验。</text><text x="64" y="1600" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">仅保存运营记录；不修改原文、Wiki、FAQ，不触发知识修复。图中路径均为设计方案。</text></svg>