<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1470" viewBox="0 0 1920 1470" role="img" aria-labelledby="title desc"><title id="title">知识运营整体架构 v1.2</title><desc id="desc">一期集中实现观测、回答验证、只读根因诊断、风险分流和重点复核，结论留存后结束；知识处置与在线防线为后续范围。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7790B0" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1920" height="1470" rx="0" fill="#F3F6FB"/><rect x="64" y="38" width="280" height="34" rx="8" fill="#EAF0FF"/><text x="204.0" y="62" font-size="17" font-weight="500" fill="#245BDB" text-anchor="middle">WEKNORA  /  DESIGN 01</text><text x="64" y="123" font-size="46" font-weight="650" fill="#172B46" text-anchor="start">先诊断，再分流，让人工聚焦关键问题</text><text x="66" y="167" font-size="22" font-weight="400" fill="#576A82" text-anchor="start">一期：观测 → 回答验证 → 根因诊断 → 风险分流 → 重点复核 / 抽检 → 结论留存</text><rect x="1632" y="47" width="224" height="34" rx="8" fill="#EAF0FF"/><text x="1744.0" y="71" font-size="18" font-weight="500" fill="#245BDB" text-anchor="middle">v1.2 · 2026.09.28</text><rect x="64" y="211" width="332" height="947" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="90" y="257" font-size="27" font-weight="600" fill="#172B46" text-anchor="start">现有问答与数据</text><rect x="84" y="293" width="292" height="144" rx="16" fill="#F8FAFD" stroke="#DCE4EF" stroke-width="1.5"/><rect x="104" y="317" width="5" height="25" rx="2" fill="#245BDB"/><text x="123" y="338" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">RAG 问答</text><text x="109" y="381" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">快速流水线 / RAG Agent</text><text x="109" y="415" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">原文分块 · FAQ · 文档读取</text><rect x="84" y="456" width="292" height="144" rx="16" fill="#F8FAFD" stroke="#DCE4EF" stroke-width="1.5"/><rect x="104" y="480" width="5" height="25" rx="2" fill="#245BDB"/><text x="123" y="501" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">Wiki 问答</text><text x="109" y="544" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">搜索 / 页面阅读 / 来源回查</text><text x="109" y="578" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">页面正文 · 摘要 · 关联信息</text><rect x="84" y="619" width="292" height="144" rx="16" fill="#F8FAFD" stroke="#DCE4EF" stroke-width="1.5"/><rect x="104" y="643" width="5" height="25" rx="2" fill="#245BDB"/><text x="123" y="664" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">Wiki + RAG</text><text x="109" y="707" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">按问题选择工具</text><text x="109" y="741" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">记录当次实际使用的来源</text><path d="M88,797 L372,797" fill="none" stroke="#DCE4EF" stroke-width="1.5"/><text x="90" y="838" font-size="23" font-weight="600" fill="#172B46" text-anchor="start">启用后新问答</text><text x="90" y="877" font-size="19" font-weight="400" fill="#576A82" text-anchor="start">运行开始时确定采集范围</text><text x="90" y="910" font-size="19" font-weight="400" fill="#576A82" text-anchor="start">不补采旧问答或停用期数据</text><rect x="84" y="970" width="292" height="155" rx="16" fill="#FFF8E8"/><text x="104" y="1008" font-size="22" font-weight="600" fill="#946000" text-anchor="start">事实边界</text><text x="104" y="1046" font-size="19" font-weight="400" fill="#946000" text-anchor="start">当时证据与事后补查分开</text><text x="104" y="1078" font-size="19" font-weight="400" fill="#946000" text-anchor="start">缺失与未知必须保留</text><rect x="452" y="211" width="1000" height="947" rx="16" fill="#EBF1FF" stroke="#A8BEED" stroke-width="1.5"/><text x="480" y="257" font-size="29" font-weight="650" fill="#172B46" text-anchor="start">集中模块  internal/knowledgeops</text><rect x="1236" y="232" width="190" height="34" rx="8" fill="#EAF0FF"/><text x="1331.0" y="256" font-size="17" font-weight="500" fill="#245BDB" text-anchor="middle">一期 · 默认关闭</text><rect x="480" y="288" width="944" height="129" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><rect x="500" y="312" width="5" height="25" rx="2" fill="#245BDB"/><text x="519" y="333" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">薄接入与独立证据档案</text><text x="505" y="376" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">运行身份 / 实际可读内容 / 来源版本 / 截断与完成状态</text><path d="M396,537 L422,537 L422,353 L470,353" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="450" width="944" height="124" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><rect x="500" y="474" width="5" height="25" rx="2" fill="#245BDB"/><text x="519" y="495" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">01  观测与回答验证</text><text x="505" y="538" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">检查覆盖与失败原因；按论断判断当时证据支持性</text><path d="M952,419 L952,441" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="607" width="944" height="124" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><rect x="500" y="631" width="5" height="25" rx="2" fill="#137D6D"/><text x="519" y="652" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">02  只读根因诊断</text><text x="505" y="695" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">链路排查 + 按需来源比较；保留支持、反对证据和未知项</text><path d="M952,576 L952,598" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="764" width="944" height="124" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><rect x="500" y="788" width="5" height="25" rx="2" fill="#245BDB"/><text x="519" y="809" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">03  风险分流与问题归组</text><text x="505" y="852" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">低风险自动记录 / 分层抽检 / 业务复核 / 待补证 / 技术排查</text><path d="M952,733 L952,755" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><path d="M952,888 L952,914" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="928" width="944" height="197" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="506" y="970" font-size="26" font-weight="600" fill="#172B46" text-anchor="start">独立保存结论与操作历史</text><text x="506" y="1011" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">运行 / 证据 / 验证 / 诊断 / 分流 / 人工复核 / 任务</text><text x="506" y="1046" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">回答与根因分别复核，自动记录不计作人工确认</text><text x="506" y="1081" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">权限继承来源；按版本追加，重跑不覆盖历史</text><rect x="1510" y="211" width="346" height="947" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="1536" y="257" font-size="28" font-weight="600" fill="#172B46" text-anchor="start">运营工作台</text><rect x="1532" y="293" width="302" height="175" rx="16" fill="#F8FAFD" stroke="#DCE4EF" stroke-width="1.5"/><rect x="1552" y="317" width="5" height="25" rx="2" fill="#245BDB"/><text x="1571" y="338" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">覆盖与诊断总览</text><text x="1557" y="381" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">证据覆盖 · 根因分布</text><text x="1557" y="415" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">分流量 · 人工负担 · 漏报</text><rect x="1532" y="488" width="302" height="175" rx="16" fill="#F8FAFD" stroke="#DCE4EF" stroke-width="1.5"/><rect x="1552" y="512" width="5" height="25" rx="2" fill="#946000"/><text x="1571" y="533" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">待复核</text><text x="1557" y="576" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">先看诊断包与待裁决点</text><text x="1557" y="610" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">同源同版本问题归组</text><text x="1557" y="644" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">高风险保留人工复核</text><rect x="1532" y="706" width="302" height="175" rx="16" fill="#F8FAFD" stroke="#DCE4EF" stroke-width="1.5"/><rect x="1552" y="730" width="5" height="25" rx="2" fill="#137D6D"/><text x="1571" y="751" font-size="25" font-weight="600" fill="#172B46" text-anchor="start">复核记录</text><text x="1557" y="794" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">回答与根因分别确认</text><text x="1557" y="828" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">人工意见及机器版本可追溯</text><text x="1557" y="862" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">自动记录单独展示</text><rect x="1532" y="930" width="302" height="195" rx="16" fill="#EAF6F2"/><text x="1554" y="970" font-size="23" font-weight="600" fill="#137D6D" text-anchor="start">本期止于结论留存</text><text x="1554" y="1012" font-size="19" font-weight="400" fill="#137D6D" text-anchor="start">允许写入运营记录</text><text x="1554" y="1045" font-size="19" font-weight="400" fill="#137D6D" text-anchor="start">不修改原文 / Wiki / FAQ</text><text x="1554" y="1078" font-size="19" font-weight="400" fill="#137D6D" text-anchor="start">确认诊断不触发修复</text><path d="M1452,827 L1500,827" fill="none" stroke="#7790B0" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="1190" width="880" height="126" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5" stroke-dasharray="7 5"/><text x="89" y="1231" font-size="25" font-weight="600" fill="#576A82" text-anchor="start">后续 L3 · 经审批的知识处置</text><text x="89" y="1276" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">主动检查 → 变更提案 → 审批 → 执行 → 原模式回归</text><rect x="974" y="1190" width="882" height="126" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5" stroke-dasharray="7 5"/><text x="999" y="1231" font-size="25" font-weight="600" fill="#576A82" text-anchor="start">远期 L4 · 在线防线</text><text x="999" y="1276" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">完成业务校准后，另行设计门控、拒答与流式发布策略</text><rect x="64" y="1340" width="1792" height="65" rx="16" fill="#172B46"/><text x="90" y="1381" font-size="23" font-weight="500" fill="#FFFFFF" text-anchor="start">main 合并边界：业务集中 · 只读适配器 · 少量采集与注册接线 · 独立迁移 · 不复制问答引擎</text><text x="64" y="1440" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">v1.2 设计基线 · Langfuse 为可选辅助；当前一期不接通知识写入。</text></svg>