<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1600" viewBox="0 0 1920 1600" role="img" aria-labelledby="title desc"><title id="title">诊断与复核详情 v1.2</title><desc id="desc">混合配置实际只读Wiki。机器已完成诊断：回答有Wiki支持，但补查原文出现年限差异，疑似更新滞后，历史生效范围缺证；人工分别复核回答与根因。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7790B0" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1920" height="1600" rx="0" fill="#F3F6FB"/><rect x="0" y="0" width="242" height="1600" rx="0" fill="#FFFFFF"/><path d="M242,0 L242,1600" fill="none" stroke="#DCE4EF" stroke-width="1.5"/><rect x="28" y="30" width="40" height="40" rx="11" fill="#245BDB"/><text x="48" y="59" font-size="23" font-weight="650" fill="#FFFFFF" text-anchor="middle">W</text><text x="80" y="59" font-size="27" font-weight="650" fill="#172B46" text-anchor="start">WeKnora</text><text x="30" y="124" font-size="17" font-weight="400" fill="#576A82" text-anchor="start">工作空间</text><text x="30" y="158" font-size="20" font-weight="600" fill="#172B46" text-anchor="start">供应链金融知识中心</text><rect x="30" y="187" width="17" height="17" rx="4" fill="none" stroke="#7E8DA2" stroke-width="1.5"/><text x="64" y="207" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">对话</text><rect x="30" y="250" width="17" height="17" rx="4" fill="none" stroke="#7E8DA2" stroke-width="1.5"/><text x="64" y="270" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">知识库</text><rect x="30" y="313" width="17" height="17" rx="4" fill="none" stroke="#7E8DA2" stroke-width="1.5"/><text x="64" y="333" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">智能体</text><rect x="30" y="376" width="17" height="17" rx="4" fill="none" stroke="#7E8DA2" stroke-width="1.5"/><text x="64" y="396" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">产物</text><rect x="16" y="426" width="210" height="49" rx="9" fill="#EAF0FF"/><rect x="30" y="439" width="17" height="17" rx="4" fill="none" stroke="#245BDB" stroke-width="1.5"/><text x="64" y="459" font-size="21" font-weight="600" fill="#245BDB" text-anchor="start">知识运营</text><rect x="30" y="502" width="17" height="17" rx="4" fill="none" stroke="#7E8DA2" stroke-width="1.5"/><text x="64" y="522" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">设置</text><text x="29" y="1528" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">工作空间管理员</text><text x="29" y="1561" font-size="17" font-weight="400" fill="#576A82" text-anchor="start">设计稿 v1.2</text><text x="280" y="51" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">知识运营  /  待复核 / 诊断详情</text><rect x="1655" y="25" width="235" height="34" rx="8" fill="#FFF4DC"/><text x="1772.5" y="49" font-size="17" font-weight="500" fill="#946000" text-anchor="middle">示例数据 · 非真实统计</text><text x="280" y="116" font-size="35" font-weight="650" fill="#172B46" text-anchor="start">诊断与复核详情</text><text x="280" y="154" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">QA-DEMO-042  ·  API  ·  企业融资准入审核  ·  问题组 G-012</text><rect x="280" y="182" width="230" height="34" rx="8" fill="#EAF0FF"/><text x="395.0" y="206" font-size="18" font-weight="500" fill="#245BDB" text-anchor="middle">配置：Wiki + RAG</text><rect x="526" y="182" width="244" height="34" rx="8" fill="#EAF0FF"/><text x="648.0" y="206" font-size="18" font-weight="500" fill="#245BDB" text-anchor="middle">实际证据：仅 Wiki</text><rect x="786" y="182" width="142" height="34" rx="8" fill="#EAF6F2"/><text x="857.0" y="206" font-size="18" font-weight="500" fill="#137D6D" text-anchor="middle">采集完整</text><rect x="944" y="182" width="252" height="34" rx="8" fill="#FDEEF0"/><text x="1070.0" y="206" font-size="18" font-weight="500" fill="#B93848" text-anchor="middle">高风险 · 优先复核</text><rect x="280" y="238" width="1592" height="94" rx="16" fill="#FFF4DC" stroke="#EDD8A7" stroke-width="1.5"/><text x="305" y="276" font-size="26" font-weight="600" fill="#946000" text-anchor="start">诊断已完成 · 疑似 Wiki 更新滞后，历史适用性仍缺证</text><text x="305" y="313" font-size="21" font-weight="400" fill="#172B46" text-anchor="start">待裁决：D1 的“一年”要求在问答发生时是否已对该产品和主体生效？</text><rect x="280" y="356" width="506" height="385" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="305" y="398" font-size="26" font-weight="600" fill="#172B46" text-anchor="start">问题与回答时依据</text><text x="305" y="441" font-size="21" font-weight="400" fill="#172B46" text-anchor="start">问：企业融资准入要求成立至少几年？</text><text x="305" y="477" font-size="21" font-weight="400" fill="#172B46" text-anchor="start">答：企业成立须满两年。</text><path d="M305,502 L761,502" fill="none" stroke="#DCE4EF" stroke-width="1.5"/><text x="305" y="539" font-size="19" font-weight="400" fill="#576A82" text-anchor="start">论断 C1 · $.conclusion</text><rect x="305" y="560" width="456" height="88" rx="16" fill="#EFF9F5"/><text x="325" y="595" font-size="21" font-weight="400" fill="#137D6D" text-anchor="start">回答支持性：支持</text><text x="325" y="627" font-size="21" font-weight="400" fill="#137D6D" text-anchor="start">与当时实际读取的 W1 一致</text><text x="305" y="686" font-size="17" font-weight="400" fill="#576A82" text-anchor="start">09:10 读取 Wiki v12，未截断、已送入模型</text><text x="305" y="715" font-size="17" font-weight="400" fill="#576A82" text-anchor="start">当次没有读取原文；不据此判定工具使用错误</text><rect x="810" y="356" width="1062" height="385" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="836" y="398" font-size="26" font-weight="600" fill="#172B46" text-anchor="start">机器根因诊断  D-042 / v1</text><rect x="1623" y="371" width="224" height="34" rx="8" fill="#EAF6F2"/><text x="1735.0" y="395" font-size="18" font-weight="500" fill="#137D6D" text-anchor="middle">09:16 已完成</text><text x="836" y="444" font-size="24" font-weight="600" fill="#946000" text-anchor="start">候选 1 · Wiki 更新滞后（疑似）</text><text x="836" y="485" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">支持依据：W1 写“两年”，关联原文 D1 r7 写“一年”；产品与主体字段一致。</text><text x="836" y="522" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">限制 / 反对线索：问答时适用的原文修订未取到；可能存在历史版本或特殊条款。</text><text x="836" y="559" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">已排查：论断与 W1 一致；未发现本次生成篡改年限，采集未见截断。</text><path d="M836,584 L1847,584" fill="none" stroke="#DCE4EF" stroke-width="1.5"/><text x="836" y="622" font-size="21" font-weight="600" fill="#172B46" text-anchor="start">仍需补证</text><text x="836" y="659" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">D1 的生效日期、历史修订与特殊条款；当前差异不足以断言当时 Wiki 错误。</text><text x="836" y="694" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">分流依据：准入年限属于高风险 + 来源差异 + 关键适用性不清。</text><rect x="280" y="765" width="1012" height="474" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="305" y="808" font-size="26" font-weight="600" fill="#172B46" text-anchor="start">可追溯证据链</text><rect x="305" y="832" width="277" height="34" rx="8" fill="#EAF0FF"/><text x="443.5" y="856" font-size="18" font-weight="500" fill="#245BDB" text-anchor="middle">W1 · 回答时实际证据</text><text x="305" y="902" font-size="23" font-weight="600" fill="#172B46" text-anchor="start">企业融资准入 Wiki · v12 · 09:10</text><rect x="305" y="925" width="962" height="61" rx="9" fill="#EFF9F5"/><text x="325" y="965" font-size="24" font-weight="400" fill="#137D6D" text-anchor="start">“申请企业应依法设立，且成立时间须满两年。”</text><path d="M305,1010 L1267,1010" fill="none" stroke="#DCE4EF" stroke-width="1.5"/><rect x="305" y="1028" width="277" height="34" rx="8" fill="#FFF4DC"/><text x="443.5" y="1052" font-size="18" font-weight="500" fill="#946000" text-anchor="middle">D1 · 诊断器事后补查</text><text x="305" y="1097" font-size="23" font-weight="600" fill="#172B46" text-anchor="start">融资准入制度 · r7 · 09:13 只读获取</text><rect x="305" y="1120" width="962" height="61" rx="9" fill="#FFFAEF"/><text x="325" y="1160" font-size="24" font-weight="400" fill="#946000" text-anchor="start">“申请企业成立时间须满一年。”</text><text x="305" y="1213" font-size="19" font-weight="400" fill="#576A82" text-anchor="start">D1 不计入模型当时证据；历史生效范围未确认，诊断明确保留未知。</text><rect x="1316" y="765" width="556" height="474" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="1341" y="808" font-size="26" font-weight="600" fill="#172B46" text-anchor="start">人工分别复核</text><text x="1341" y="849" font-size="19" font-weight="400" fill="#576A82" text-anchor="start">回答判定</text><rect x="1341" y="865" width="506" height="44" rx="7" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="1355" y="894" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">确认：得到当时证据支持</text><text x="1822" y="893" font-size="17" font-weight="400" fill="#576A82" text-anchor="start">⌄</text><text x="1341" y="954" font-size="19" font-weight="400" fill="#576A82" text-anchor="start">根因结论</text><rect x="1341" y="970" width="506" height="44" rx="7" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="1355" y="999" font-size="18" font-weight="400" fill="#576A82" text-anchor="start">待补证：尚不能确认更新滞后</text><text x="1822" y="998" font-size="17" font-weight="400" fill="#576A82" text-anchor="start">⌄</text><text x="1341" y="1059" font-size="19" font-weight="400" fill="#576A82" text-anchor="start">复核理由 / 所需材料</text><rect x="1341" y="1076" width="506" height="126" rx="9" fill="#FCFDFE" stroke="#DCE4EF" stroke-width="1.5"/><text x="1359" y="1110" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">W1 足以支持回答论断；</text><text x="1359" y="1143" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">请补充 D1 的历史修订与生效依据，</text><text x="1359" y="1176" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">再确认是否属于 Wiki 更新滞后。</text><rect x="280" y="1263" width="1592" height="113" rx="16" fill="#EAF0FF" stroke="#DCE4EF" stroke-width="1.5"/><text x="305" y="1305" font-size="24" font-weight="600" fill="#245BDB" text-anchor="start">问题组 G-012 · 关联 18 条回答</text><text x="305" y="1344" font-size="21" font-weight="400" fill="#576A82" text-anchor="start">共享来源与诊断线索；本次仅复核 QA-DEMO-042 的 C1 和 D-042/v1，不自动确认其他回答。</text><rect x="280" y="1400" width="1592" height="88" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="305" y="1453" font-size="19" font-weight="400" fill="#576A82" text-anchor="start">复核人：业务专家  ·  保存为追加记录</text><rect x="1290" y="1418" width="185" height="48" rx="8" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/><text x="1382" y="1450" font-size="19" font-weight="500" fill="#245BDB" text-anchor="middle">查看诊断轨迹</text><rect x="1491" y="1418" width="354" height="48" rx="8" fill="#245BDB"/><text x="1668" y="1450" font-size="20" font-weight="550" fill="#FFFFFF" text-anchor="middle">保存两项复核结论</text><text x="280" y="1545" font-size="20" font-weight="400" fill="#576A82" text-anchor="start">当前选择尚未提交。保存只留存复核意见，不修改知识；补证后生成新诊断版本。</text></svg>